[package]
name = "tombit"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/unrs/tombit"
description = "Unified toolkit for tombi: TOML format and lint from Node.js and WebAssembly"
keywords = ["tombi", "toml", "formatter", "linter", "napi"]
categories = ["development-tools", "parser-implementations"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14", default-features = false, features = [
  "napi4",
  "serde-json",
] }
napi-derive = "3.6"
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
tombi-config = { path = "tombi/crates/tombi-config" }

# tombi is vendored as a submodule (`tombi`) because its crates are not
# published on crates.io yet. Bumping the pin is how the toolchain is upgraded.
#
# `tombi-lib`'s `native` feature is opt-in through ours: it enables
# `tombi-schema-store/native` -> reqwest -> rustls/ring, and ring's C/assembly
# build only works on the targets that ship a supported toolchain. Targets that
# cannot build it are compiled without `schema` and get the no-network stub.
# Builds without it force `schema.enabled = false`, since a fetch would fail;
# builds with it keep tombi's default (on) and the caller overrides with
# `overrideConfig: { schema: { enabled: false } }` to stay offline.
[features]
default = []
schema = ["tombi-lib/native"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_tombi = { path = "tombi/rust/serde_tombi", default-features = false }
tombi-lib = { path = "tombi/rust/tombi-lib", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }

# WASI gets the in-memory filesystem and no HTTP client. `serde_tombi/wasm` is a
# cfg switch that drops its sync `to_string` (which needs tokio's multi-thread
# runtime) -- it is not a request for the browser runtime.
[target.'cfg(target_family = "wasm")'.dependencies]
futures = "0.3"
serde_tombi = { path = "tombi/rust/serde_tombi", default-features = false, features = [
  "wasm",
] }
tombi-lib = { path = "tombi/rust/tombi-lib", default-features = false }

[build-dependencies]
napi-build = "2.6"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
