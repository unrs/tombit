name: Build NAPI

# Reusable so the PR workflow and the release both build exactly the same matrix:
# the release gate (`publish == 'true'`) belongs to the caller, not here.
on:
  workflow_call:
    inputs:
      target:
        description: Build only this target
        required: false
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: Build only this target
        required: false
        type: string

permissions:
  contents: read

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  # Every target needs its own build recipe: musl goes through zig, riscv64 and
  # loongarch64 need a cross gcc, s390x needs lld, the wasm targets build with a
  # different profile, and FreeBSD needs its own VM (see `build-freebsd`).
  # Modelled on unrs-resolver's `release-napi.yml`.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.target || inputs.target == matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build
          - os: windows-latest
            target: i686-pc-windows-msvc
            architecture: x86
            cpu: ia32
            build: pnpm build

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build --use-napi-cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build -x
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build -x
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: pnpm build --use-napi-cross
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            build: pnpm build -x
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            build: pnpm build --use-napi-cross
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            build: export CFLAGS="-fuse-ld=lld" && pnpm build --use-napi-cross
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            build: |-
              sudo apt-get update &&
              sudo apt-get install gcc-riscv64-linux-gnu g++-riscv64-linux-gnu -y &&
              export TARGET_CC=riscv64-linux-gnu-gcc &&
              export CXX=riscv64-linux-gnu-g++ &&
              pnpm build
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            build: |-
              sudo apt-get update &&
              sudo apt-get install gcc-13-loongarch64-linux-gnu g++-13-loongarch64-linux-gnu -y &&
              export CC_loongarch64_unknown_linux_gnu=loongarch64-linux-gnu-gcc-13 &&
              export CXX_loongarch64_unknown_linux_gnu=loongarch64-linux-gnu-g++-13 &&
              export CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER=loongarch64-linux-gnu-gcc-13 &&
              pnpm build
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            build: pnpm build -x

          - os: ubuntu-latest
            target: aarch64-linux-android
            build: pnpm build
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            architecture: x64
            build: pnpm build

          - os: ubuntu-latest
            target: aarch64-unknown-linux-ohos
            build: pnpm build
          - os: ubuntu-latest
            target: x86_64-unknown-linux-ohos
            build: pnpm build

          - os: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build
          - os: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build
          - os: macos-latest
            target: universal-apple-darwin
            rust_target: x86_64-apple-darwin,aarch64-apple-darwin
            build: pnpm build

          - os: ubuntu-latest
            target: wasm32-wasip1
            build: pnpm build:debug --release
          - os: ubuntu-latest
            target: wasm32-wasip1-threads
            build: pnpm build:debug --release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          architecture: ${{ matrix.architecture }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # `universal-apple-darwin` is not a rustup target: napi lipo's both
          # macOS arches, so both must be installed.
          targets: ${{ matrix.rust_target || matrix.target }}

      - name: Setup Zig
        if: contains(matrix.target, 'musl') || contains(matrix.target, 'windows-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Setup OpenHarmony SDK
        if: contains(matrix.target, 'ohos')
        uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c # v1.0.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ${{ matrix.build }} --target ${{ matrix.target }}
        shell: bash

      - name: Upload binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: |
            tombit.*.node
            tombit.*.wasm
          if-no-files-found: error

      - name: Upload generated loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-binding
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  build-freebsd:
    name: Build x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    if: ${{ !inputs.target || inputs.target == 'x86_64-unknown-freebsd' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build
        uses: cross-platform-actions/action@233156312992f3f169d8d0c633c21d12a5d30455 # v1.0.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          version: 14.2
          memory: 8G
          cpu_count: 3
          environment_variables: DEBUG RUSTUP_IO_THREADS
          shell: bash
          run: |
            sudo pkg install -y -f curl libnghttp2 node22 npm cmake
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            node -v
            export COREPACK_INTEGRITY_KEYS=0
            sudo corepack enable
            pnpm install
            pnpm build --target x86_64-unknown-freebsd
            rm -rf node_modules target

      - name: Upload binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-x86_64-unknown-freebsd
          path: tombit.*.node
          if-no-files-found: error
